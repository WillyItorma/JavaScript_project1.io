
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Interactive Example</title>
</head>
<body>
    <h1>Interactive Example</h1>

    <h3>Section 1 Lessons</h3>

    <!--Button to toggle menu-->
    <button id="menuButton">Toggle menu</button>

      <!--Toggle  menu-->
    <ul id="menu" style="display: none;">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>

     <!--Button to display Alert-->
    <button id="alertButton">Show Alert</button>

     <!--Increment and decrement button-->
    <button id="incrementButton">Increment Button</button>
    <button id="decrementButton">Decrement Button</button>
    <button id="resetButton">Reset</button>
   
   <p>counter: <span id="counter">0</span></p>

   <!--form for name input-->
   
    <label for ="username">Enter your name:</label>
    <input type="text" id="username" placeholder="Your name">
    <button id="greetButton">Greet Me</button>

    <!--section where the greeting will appear-->
    <p id="greetingMessage"></p>

    <!--button id add a new paragraph-->
    <button id="addParagraphButton">Add Paragraph</button>

    <!--Section where the paragraph will be added-->
    <br>
    <br>
    <div id="paragraphContainer"></div>

    <!--link to javascript file-->
    <script src="js/script.js"></script>
		
</body>
</html>
